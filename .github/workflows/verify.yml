name: DealRadar verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dealradar
          POSTGRES_PASSWORD: dealradar
          POSTGRES_DB: dealradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dealradar -d dealradar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://dealradar:dealradar@127.0.0.1:5432/dealradar_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q backend scrapers services scripts tests
      - run: python -m unittest discover -s tests -v
      - run: npm ci --include=dev
      - name: Exercise the web client against fixture providers
        run: |
          python scripts/smoke_server.py 8017 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8017/health; then
              node scripts/ui_smoke.mjs http://127.0.0.1:8017
              exit
            fi
            sleep 1
          done
          echo 'DealRadar fixture server did not start' >&2
          exit 1
